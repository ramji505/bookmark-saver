apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookmark-saver-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ramji505/bookmark-saver.git'
    targetRevision: HEAD
    path: bookmark-saver-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true