version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: bookmark_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bookmark_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookmark_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/bookmark_saver
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - bookmark_net

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: bookmark_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - bookmark_net

volumes:
  mongo_data:

networks:
  bookmark_net:
    driver: bridge